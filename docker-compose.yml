services:
  postgres:
    image: postgres:16-alpine
    container_name: dhl-dac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dhl_incident_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - dhl_dac_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dhl_incident_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dhl_dac_postgres_data:
